{% extends 'base.html' %}

{% block title %}
    TextAnalyzer - Анализ текстовых файлов: Исследователь частоты слов по TF-IDF
{% endblock %}


{% block main %}
    <div class="px-4 py-5 my-5 text-center">
        <h1 class="display-5 fw-bold text-body-emphasis">TextAnalyzer</h1>
        <div class="col-lg-6 mx-auto">
            <p class="lead mb-4">Анализ текстовых файлов: Исследователь частоты слов по TF-IDF</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{% url 'new-file-upload' %}" class="btn btn-primary btn-lg px-4 gap-3">Анализ нового файла</a>
                <a class="btn btn-outline-secondary btn-lg px-4">Список обработанных файлов</a>
            </div>
        </div>
    </div>
{% endblock %}
